<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

#countdown {
  font-size: 60px;
  margin-top: 40px;
}

/* 🖼️ Bilder */
img {
  width: 100%;
  height: 100vh;
  object-fit: contain;
  display: none;
}

/* 🎉 Endtext */
#endText {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 45px;
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
  z-index: 9999;
}

/* Button */
button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #ff4081;
  color: white;
  cursor: pointer;
}

/* Konfetti */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<h1 id="title">🎂 Alles Gute zum Geburtstag! 🎂</h1>
<p id="text">Bereit? 😏</p>

<button onclick="startExperience()">🎉 Start (mit Ton)</button>

<div id="countdown"></div>

<div id="endText">🎉 Alles Gute zum Geburtstag! 🎉</div>

<audio id="music" src="moodmode-happy-birthday-song-455067.mp3"></audio>

<img src="bild1.jpeg">
<img src="bild2.jpeg">
<img src="bild3.jpeg">
<img src="bild4.jpeg">
<img src="bild5.jpeg">
<img src="bild6.jpeg">
<img src="bild7.jpeg">
<img src="bild8.jpeg">
<img src="bild9.jpeg">
<img src="bild10.jpeg">
<img src="bild11.jpeg">
<img src="bild12.jpeg">

<canvas id="confetti"></canvas>

<script>
function startExperience() {
  document.querySelector("button").style.display = "none";

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  startCountdown();
}

function startCountdown() {
  let count = 3;
  let display = document.getElementById("countdown");

  let interval = setInterval(() => {
    display.innerText = count;
    count--;

    if (count < 0) {
      clearInterval(interval);
      display.innerText = "";

      document.getElementById("text").style.display = "none";
      document.getElementById("title").style.display = "none";

      startShow();
    }
  }, 1000);
}

function startShow() {
  let images = document.querySelectorAll("img");
  let music = document.getElementById("music");

  let current = 0;

  // 🔥 ERSTES BILD + MUSIK GLEICHZEITIG
  images[0].style.display = "block";

  music.currentTime = 0;
  music.play().catch(() => {
    alert("🔊 Tippe nochmal für Ton");
  });

  startConfetti();

  let interval = setInterval(() => {
    images[current].style.display = "none";
    current++;

    if (current < images.length) {
      images[current].style.display = "block";
    } else {
      clearInterval(interval);

      // 🎵 Musik stoppen
      music.pause();
      music.currentTime = 0;

      showEndText();
    }
  }, 2500);
}

// 🎉 Endtext anzeigen
function showEndText() {
  let images = document.querySelectorAll("img");

  images.forEach(img => img.style.display = "none");

  let text = document.getElementById("endText");
  text.style.display = "block";

  setTimeout(() => {
    text.style.opacity = 1;
  }, 100);
}

// 🎆 Konfetti
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let pieces = [];

for (let i = 0; i < 120; i++) {
  pieces.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 6 + 4,
    speed: Math.random() * 3 + 2
  });
}

function startConfetti() {
  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach(p => {
      p.y += p.speed;

      if (p.y > canvas.height) p.y = 0;

      ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,50%)";
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    requestAnimationFrame(update);
  }

  update();
}
</script>

</body>
</html>
